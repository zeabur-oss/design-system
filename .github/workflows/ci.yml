name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fallow audit compares HEAD with HEAD^ (on a pull request, the base branch).
          fetch-depth: 2
      - uses: zeabur-oss/.github/actions/ci-setup@322a53bbe1ab1a1e1cea8102781069aa094492dc # main
      - run: nix develop -c scripts/ci/check.sh

  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@322a53bbe1ab1a1e1cea8102781069aa094492dc # main
      - run: nix develop -c scripts/ci/test.sh

  storybook:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@322a53bbe1ab1a1e1cea8102781069aa094492dc # main
      - run: nix develop -c scripts/ci/storybook.sh

  zizmor:
    uses: zeabur-oss/.github/.github/workflows/zizmor.yml@322a53bbe1ab1a1e1cea8102781069aa094492dc # main

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [check, test, storybook, zizmor]
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@322a53bbe1ab1a1e1cea8102781069aa094492dc # main
