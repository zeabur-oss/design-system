name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job is in scripts/ci.sh (`scripts/ci.sh --list`), which runs the same on any Linux machine
  # with Nix; the shared workflow only checks out and installs Nix.
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
    with:
      # `fallow audit` compares HEAD with HEAD^ (on a pull request, the base branch).
      fetch-depth: 2
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
