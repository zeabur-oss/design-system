name: Release pull request

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version instead of the one the change files give (0.2.0); empty for theirs'
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    uses: zeabur-oss/.github/.github/workflows/release-pr.yml@f6443ea2031ad2f52962303a71e41c9a98bfde26 # main
    with:
      version: ${{ inputs.version }}
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
