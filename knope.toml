# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Changelog and releases").
[package]
versioned_files = ["package.json"]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

# knope writes package.json through its JSON serializer, which drops the final newline.
[[workflows.steps]]
type = "Command"
command = "bun run fmt package.json"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
