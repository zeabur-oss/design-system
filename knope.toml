# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Changelog and releases").
[package]
# A regex, so knope replaces the version alone and leaves the rest of package.json as it is.
versioned_files = [{ path = "package.json", regex = '"version": "(?<version>[^"]+)"' }]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
